name: deb

# Build a Debian source in a sid container for amd64 and arm64, attest
# every file and upload them as the artifacts deb-amd64 and deb-arm64.
# Callers grant contents: read, id-token: write, attestations: write and
# artifact-metadata: write; their release job needs contents: write.

on:
  workflow_call:
    inputs:
      repository:
        description: owner/repo to build; the caller when empty
        type: string
        default: ''
      ref:
        description: branch, tag or commit; a debian/* tag must match the changelog
        type: string
        required: true
      version:
        description: version to set with dch before the build
        type: string
        default: ''

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # source + arch:all + amd64
          - arch: amd64
            runner: ubuntu-26.04
            build: full
          # arm64 binaries only
          - arch: arm64
            runner: ubuntu-26.04-arm
            build: any
    runs-on: ${{ matrix.runner }}
    container: debian:sid
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev lintian

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          path: src
          persist-credentials: false

      - name: Check the tag against the changelog
        working-directory: src
        env:
          REF: ${{ inputs.ref }}
        run: |
          case $REF in
            refs/tags/debian/*|debian/*) tag=${REF#refs/tags/} ;;
            *) exit 0 ;;
          esac
          # a debian/* branch
          if git rev-parse -q --verify "refs/remotes/origin/$tag" > /dev/null; then
            exit 0
          fi
          # DEP-14
          want=$(echo "${tag#debian/}" | tr '%_' ':~')
          have=$(dpkg-parsechangelog -SVersion)
          if [ "$want" != "$have" ]; then
            echo "::error::$tag is $want but debian/changelog says $have"
            exit 1
          fi

      - name: Set the version
        if: inputs.version != ''
        working-directory: src
        env:
          REPOSITORY: ${{ inputs.repository || github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          apt-get install -y --no-install-recommends devscripts
          # keep the changelog's maintainer
          DEBEMAIL=$(dpkg-parsechangelog -SMaintainer) \
            dch -b -v "$VERSION" -D UNRELEASED "CI build of $REPOSITORY@$(git rev-parse --short=7 HEAD)."

      - name: Install build dependencies
        run: apt-get build-dep -y --no-install-recommends ./src

      - name: Check for arch-dependent packages
        id: arch
        if: matrix.build == 'any'
        working-directory: src
        run: |
          if [ -z "$(dh_listpackages -a)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::no arch-dependent package for ${{ matrix.arch }}; arch:all comes from the amd64 build"
          fi

      - name: Build
        if: steps.arch.outputs.skip != 'true'
        working-directory: src
        run: dpkg-buildpackage --build=${{ matrix.build }} -us -uc

      - uses: actions/upload-artifact@v7
        if: steps.arch.outputs.skip != 'true'
        with:
          name: deb-${{ matrix.arch }}
          path: |
            *.changes
            *.buildinfo
            *.dsc
            *.tar.*
            *.deb
          if-no-files-found: error

      - name: Lintian
        if: steps.arch.outputs.skip != 'true'
        # reports only
        continue-on-error: true
        run: lintian -i --fail-on none *.changes

  attest:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: out
          merge-multiple: true

      - uses: actions/attest@v4
        with:
          subject-path: out/*
